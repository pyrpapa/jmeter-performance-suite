name: Performance Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Smoke Test
        run: mvn verify -Psmoke

      - name: Upload Smoke Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: |
            target/jmeter/results/
            target/jmeter/reports/
          retention-days: 30

  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    needs: smoke-test  # only runs if smoke passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Load Test
        run: mvn verify -Pload

      - name: Upload Load Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results
          path: |
            target/jmeter/results/
            target/jmeter/reports/
          retention-days: 30

  stress-test:
    name: Stress Test
    runs-on: ubuntu-latest
    needs: load-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Stress Test
        run: mvn verify -Pstress

      - name: Upload Stress Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-test-results
          path: |
            target/jmeter/results/
            target/jmeter/reports/
          retention-days: 30

  spike-test:
    name: Spike Test
    runs-on: ubuntu-latest
    needs: smoke-test  # runs in parallel with load/stress, only needs smoke to pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Spike Test
        run: mvn verify -Pspike

      - name: Upload Spike Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-test-results
          path: |
            target/jmeter/results/
            target/jmeter/reports/
          retention-days: 30

  publish-dashboard:
    name: Publish Custom Dashboard
    runs-on: ubuntu-latest
    needs: [smoke-test, load-test, stress-test, spike-test]
    if: always()
    permissions:
      contents: write   # required so the GitHub Pages deploy step can push to gh-pages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download all test-result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-test-results'
          path: all-results
          merge-multiple: true

      - name: Build consolidated custom HTML dashboard
        run: >
          python3 scripts/generate_dashboard.py --results-dir all-results --output all-results/custom-report/index.html
          --job-status "smoke=${{ needs.smoke-test.result }},load=${{ needs.load-test.result }},stress=${{ needs.stress-test.result }},spike=${{ needs.spike-test.result }}"
        continue-on-error: true  # still publish the dashboard even if a test type failed its gate

      - name: Upload custom dashboard
        uses: actions/upload-artifact@v4
        with:
          name: custom-dashboard
          path: all-results/custom-report/
          retention-days: 30

      # Publishes the dashboard to GitHub Pages so it's viewable at a stable,
      # shareable URL (https://<user>.github.io/<repo>/) instead of only as a
      # downloadable artifact - good for linking from the README. Requires
      # Pages to be enabled for this repo once (Settings -> Pages -> Source:
      # Deploy from a branch -> gh-pages -> / (root)). Runs on every push to
      # master, so the live link always reflects the most recent run.
      - name: Deploy dashboard to GitHub Pages
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: all-results/custom-report